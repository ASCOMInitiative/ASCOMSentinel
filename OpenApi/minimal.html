<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>ISafetyMonitorV4 API</title>

    <!-- Swagger UI 5.32.5 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.32.5/swagger-ui.css" />

    <style>
      html
      {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
      }

      *,
      *:before,
      *:after
      {
        box-sizing: inherit;
      }

      body
      {
        margin:0;
        background: #fafafa;
      }
           
      .topbar
      {
        padding:8px 0;
        background-color:#000000!important;
      }
      
      .select-label
      {
        color:#FFFFFF!important;
      }
      
      .base-url
      {
        display:none!important;
      }
      
      .swagger-ui .info hgroup.main a
      {
        display:none!important;
      }

      .json-schema-2020-12-keyword__value--const
      {
        /* Same style as json-schema-2020-12__constraint (used for ranges) */
        background-color: #805ad5;
        color: #fff!important;
      }

      .json-schema-2020-12__attribute--primary
      {
        /* Same style as json-schema-2020-12__constraint--string (used for `format`) */
        background-color: #d69e2e;
        color: #fff!important;
        border-radius: 4px;
        padding: 1px 3px !important;
        margin-left: 10px;
        line-height: 1.5;
        font-size: inherit !important;
      }

      .response-col_links
      {
        display:none;
      }
    </style>



  </head>

  <body>
    <div id="swagger-ui"></div>

    <!-- Swagger UI 5.32.5 JS -->
    <script src="https://unpkg.com/swagger-ui-dist@5.32.5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.32.5/swagger-ui-standalone-preset.js"></script>

    <script>
  const ASCOMLogo = () => ({
    afterLoad: (system) => {
      const topbar = document.querySelector('.topbar-wrapper');
      if (!topbar) return;

      const wrapper = document.createElement('div');
      wrapper.style.display = 'flex';
      wrapper.style.alignItems = 'center';
      wrapper.style.gap = '10px';

      const img = document.createElement('img');
      img.src = 'bugt300square.jpg';
      img.width = 70;
      img.height = 70;

      const span = document.createElement('span');
      span.style.fontSize = '18px';
      span.style.color = 'white';
      span.textContent = 'ASCOM Initiative';

      wrapper.appendChild(img);
      wrapper.appendChild(span);

      topbar.prepend(wrapper);
    }
  });

  const CleanupTypes = {
    wrapComponents: {
      JSONSchema202012KeywordType: (Original, system) => (props) => {
        const HIDE_TYPE_IF = ['oneOf', 'anyOf', 'format', 'minimum', 'maximum', 'const'];
        if (HIDE_TYPE_IF.some(k => k in props.schema)) return null;
        return Original(props);
      }
    }
  };

  const ui = SwaggerUIBundle({
    url: "./safetymonitor_v4.yaml",
    dom_id: '#swagger-ui',
    deepLinking: true,
    docExpansion: 'none',
    showCommonExtensions: true,
    defaultModelRendering: 'model',
    defaultModelExpandDepth: 5,
    presets: [
      SwaggerUIBundle.presets.apis,
      SwaggerUIStandalonePreset
    ],
    plugins: [
      SwaggerUIBundle.plugins.DownloadUrl,
      ASCOMLogo,
      CleanupTypes
    ],
    supportedSubmitMethods: [],
    layout: "BaseLayout"   // ⭐ FIXED
  });
</script>
    
  </body>
</html>
